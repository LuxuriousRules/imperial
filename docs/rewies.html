        <div  id="modal" class="modal">
  <div class="modal__content">
    <div class="modal__title-wrapper">
      <h1 class="modal__title">Анкета модели</h1>
    <span id="closeModal" class="modal__close">&times;</span>
    </div>
    <form class="modal__form" id="modelForm">
      <input class="modal__item" id="username" type="text" placeholder="Ваше имя" required>
      <input class="modal__item" id="phone" type="tel" placeholder="+38 (093)" pattern="^\+38\s?\(?\d{3}\)?[\s-]?\d{3}[\s-]?\d{2}[\s-]?\d{2}$" 

required>
      <input class="modal__item" id="email" type="email" placeholder="email" required>
      <textarea class="modal__textarea" placeholder="О себе" rows="4"></textarea>
      <button class="modal__btn" type="submit">Отправить</button>

    </form>
  </div>

</div>

 

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    window.addEventListener("load", function() {
      particlesJS("particles-js", {
        particles: {
          number: { value: 200 },
          size: { value: 2 },
          move: { speed: 1 },
          opacity: { value: 0.5 },
          line_linked: { enable: false }
        },
        interactivity: {
          events: {
            onhover: { enable: false },
            onclick: { enable: false }
          }
        }
      });
    });
  </script>
